[project]
name = "vivo-linkkit"
version = "0.0.0"
description = "Clean-room interoperability client for vivo Office Kit on Linux"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # See requirements.txt for the pinned exploration set. Core runtime deps:
    "websockets",   # wss:// JSON link to the phone (PROTOCOL.md §2/§3)
    "cryptography", # aes-256-cbc session cipher (§4)
    "requests",     # phone HTTP file APIs (§2)
    "qrcode",       # pairing QR payload (§1/§5)
]

[project.scripts]
vivo-linkkit-explore = "vivolinkkit.explore:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
