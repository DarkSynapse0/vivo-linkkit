[project]
name = "vivo-linkkit"
version = "0.1.0"
description = "Clean-room interoperability client for vivo Office Kit on Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["vivo", "office-kit", "reverse-engineering", "interoperability",
            "android", "file-transfer", "clean-room"]
dependencies = [
    "websockets>=12",   # control-plane websocket to the phone (PROTOCOL.md §1)
]

[project.optional-dependencies]
# `vivolinkkit login` drives the user's vivo passport login in a real browser.
# (The `connect`/file features use only the standard library + websockets.)
login = ["playwright>=1.40"]

[project.scripts]
vivolinkkit = "vivolinkkit.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
